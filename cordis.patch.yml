# dsh-industry-graph-mcp cordis bundle patch
# 以「新增一行 mcp server」的形式注册到 dsh 的 mcp 服务列表。
# 部署时只需把下列 paths 改成你本机实际路径即可。
- insert:
    - path: plugins.mcp-servers
      items:
        - id: mcp-industry-graph
          name: A股产业链知识图谱
          transport: stdio
          command: !!js process.env.QUANT_MCP_NODE || process.execPath
          args:
            - "C:\\Users\\helib\\dsh-industry-graph-mcp\\industry-graph-mcp-server.mjs"
          cwd: "C:\\Users\\helib\\dsh-industry-graph-mcp"
          env:
            GRAPH_DATA: "C:\\Users\\helib\\dsh-industry-graph-mcp\\data\\industry-graph.json"
          enabled: true
